services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pet10
      POSTGRES_USER: pet10
      POSTGRES_PASSWORD: pet10
    ports:
      - "5432:5432"
    volumes:
      - pet10_postgres:/var/lib/postgresql/data
      - ./server/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pet10 -d pet10"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - pet10_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pet10_postgres:
  pet10_redis:
