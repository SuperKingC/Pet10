name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit on main to deploy; leave empty for latest main
        required: false
        type: string
      service:
        description: Smallest service set to update
        required: true
        default: web
        type: choice
        options:
          - web
          - api
          - all

permissions:
  contents: read

concurrency:
  group: pet10-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve approved revision
        id: revision
        run: |
          git fetch origin main
          REQUESTED_REVISION="${{ inputs.commit }}"
          if [ -z "$REQUESTED_REVISION" ]; then
            REQUESTED_REVISION=origin/main
          fi
          REVISION="$(git rev-parse --verify "${REQUESTED_REVISION}^{commit}")"
          git merge-base --is-ancestor "$REVISION" origin/main
          git checkout --detach "$REVISION"
          echo "sha=$REVISION" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run verify:full

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.service != 'api' }}
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        if: ${{ inputs.service != 'api' }}
        with:
          node-version: 22
          cache: npm
      - name: Build static assets
        if: ${{ inputs.service != 'api' }}
        env:
          VITE_USE_MOCK_API: "false"
          VITE_API_BASE_URL: "/"
          VITE_TAROT_ASSET_BASE_URL: ""
        run: |
          npm ci
          npm run build
      - name: Upload static assets to COS
        if: ${{ inputs.service != 'api' }}
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          STATIC_ASSET_VERSION: ${{ needs.validate.outputs.sha }}
        run: npm run upload:static
      - name: Verify public COS asset
        if: ${{ inputs.service != 'api' }}
        env:
          STATIC_ASSET_BASE_URL: ${{ secrets.STATIC_ASSET_BASE_URL }}
          STATIC_ASSET_VERSION: ${{ needs.validate.outputs.sha }}
        run: |
          curl --fail --head --retry 3 --max-time 30 \
            "$STATIC_ASSET_BASE_URL/$STATIC_ASSET_VERSION/pet/xiaoduoli.png"
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy approved revision
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          STATIC_ASSET_BASE_URL: ${{ secrets.STATIC_ASSET_BASE_URL }}
          REVISION: ${{ needs.validate.outputs.sha }}
          SERVICE: ${{ inputs.service }}
        run: |
          printf -v remote_command \
            'cd -- %q && STATIC_ASSET_BASE_URL=%q DEPLOY_PUBLIC_URL=%q ./deploy/update-%q.sh %q' \
            "$DEPLOY_PATH" "$STATIC_ASSET_BASE_URL" "$DEPLOY_URL" "$SERVICE" "$REVISION"
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"
      - name: Deployment summary
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          REVISION: ${{ needs.validate.outputs.sha }}
          SERVICE: ${{ inputs.service }}
        run: |
          {
            echo "## Pet10 production deployment"
            echo "- Revision: \`$REVISION\`"
            echo "- Service: \`$SERVICE\`"
            echo "- URL: $DEPLOY_URL"
            echo "- Health: $DEPLOY_URL/healthz"
          } >> "$GITHUB_STEP_SUMMARY"
