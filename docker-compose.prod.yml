services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - pet10_caddy_data:/data
      - pet10_caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 128m

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_USE_MOCK_API: "false"
        VITE_API_BASE_URL: "/"
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgres://pet10:${POSTGRES_PASSWORD}@postgres:5432/pet10
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8787"
    mem_limit: 384m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pet10
      POSTGRES_USER: pet10
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pet10_postgres:/var/lib/postgresql/data
      - ./server/sql:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pet10 -d pet10"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - pet10_redis:/data
    expose:
      - "6379"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pet10_postgres:
  pet10_redis:
  pet10_caddy_data:
  pet10_caddy_config:
