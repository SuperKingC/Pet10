<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff9ee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="小多利" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <title>小多利</title>
    <style>
      .app-splash { position: fixed; inset: 0; z-index: 999; display: grid; place-items: center; background: radial-gradient(circle at 50% 8%, #fff8e9 0, #f3e9df 48%, #e9ddd5 100%); }
      .app-splash__orb { width: 96px; height: 96px; display: grid; place-items: center; border-radius: 36px; background: linear-gradient(145deg, #ffd697, #fff1d5); box-shadow: 0 18px 36px rgba(150, 94, 48, .18); animation: splash-breathe 2.8s ease-in-out infinite; }
      .app-splash__orb img { width: 74%; height: auto; pointer-events: none; }
      .app-splash p { margin: 20px 0 0; color: #a08b80; font-size: 14px; text-align: center; }
      @keyframes splash-breathe { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.03, .97) translateY(2px); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="app-splash" id="app-splash" aria-hidden="true">
      <div>
        <div class="app-splash__orb"><img src="/pet/xiaoduoli.png" alt="小多利" /></div>
        <p>正在打开小多利的家…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
