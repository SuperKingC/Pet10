<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff9ee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="小多利" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="preload" as="image" href="/pet/xiaoduoli-large.jpg" />
    <title>小多利</title>
    <style>
      .app-splash { position: fixed; inset: 0; z-index: 999; display: grid; place-items: center; background: radial-gradient(circle at 50% 8%, #fff8e9 0, #f7ecdc 48%, #efdfd2 100%); overflow: hidden; transition: opacity .5s ease; }
      .app-splash--leaving { opacity: 0; }
      .app-splash__stage { position: relative; display: grid; place-items: center; }
      .app-splash__pet { width: min(60vw, 300px); height: auto; border-radius: 28px; animation: splash-land .9s cubic-bezier(.34, 1.56, .64, 1) both; filter: drop-shadow(0 22px 30px rgba(150, 94, 48, .22)); }
      .app-splash__paw { position: absolute; font-size: 22px; opacity: 0; animation: splash-paw 1.4s ease-out forwards; }
      .app-splash__paw:nth-child(2) { left: -14%; top: 12%; animation-delay: .55s; }
      .app-splash__paw:nth-child(3) { right: -12%; top: 30%; animation-delay: .75s; }
      .app-splash__paw:nth-child(4) { left: 6%; bottom: -6%; animation-delay: .95s; }
      .app-splash p { margin: 22px 0 0; color: #a08b80; font-size: 14px; text-align: center; animation: splash-fade-in .8s .3s ease both; }
      @keyframes splash-land {
        0% { transform: translateY(46vh) scale(.72); opacity: 0; }
        55% { transform: translateY(-3%) scale(1.04); opacity: 1; }
        74% { transform: translateY(1.4%) scale(.985, 1.015); }
        100% { transform: translateY(0) scale(1); }
      }
      @keyframes splash-paw {
        0% { transform: translateY(8px) scale(.4) rotate(-14deg); opacity: 0; }
        30% { opacity: .95; }
        100% { transform: translateY(-26px) scale(1) rotate(10deg); opacity: 0; }
      }
      @keyframes splash-fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="app-splash" id="app-splash" aria-hidden="true">
      <div>
        <div class="app-splash__stage">
          <img class="app-splash__pet" src="/pet/xiaoduoli-large.jpg" alt="小多利" />
          <span class="app-splash__paw">🐾</span>
          <span class="app-splash__paw">✨</span>
          <span class="app-splash__paw">🐾</span>
        </div>
        <p>小多利正在飞奔过来…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
